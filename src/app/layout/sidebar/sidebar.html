<aside class="sidebar" aria-label="Navegación principal">
  <div class="brand">
    <div class="brand__mark" aria-label="Identidad visual provisional">
      <app-ui-icon name="school" [size]="25" />
    </div>
    <div class="brand__copy">
      <strong>Colegio Manantial</strong>
      <span>Sistema de Gestión Escolar</span>
    </div>
  </div>

  <nav class="navigation" aria-label="Administración escolar">
    <button class="navigation__item" type="button" aria-disabled="true">
      <app-ui-icon name="students" />
      <span>Alumnos</span>
    </button>
    <button class="navigation__item" type="button" aria-disabled="true">
      <app-ui-icon name="groups" />
      <span>Grados y grupos</span>
    </button>
    <a
      class="navigation__item"
      routerLink="/profesores"
      routerLinkActive="navigation__item--active"
      ariaCurrentWhenActive="page"
    >
      <app-ui-icon name="teachers" />
      <span>Profesores</span>
    </a>
    <button class="navigation__item" type="button" aria-disabled="true">
      <app-ui-icon name="book" />
      <span>Materias</span>
    </button>
  </nav>

  <div class="sidebar__footer">
    <div class="school-year">
      <span>Ciclo Escolar</span>
      <strong>2026–2027 · Demo</strong>
    </div>
    <button class="logout" type="button" aria-disabled="true">
      <app-ui-icon name="logout" [size]="18" />
      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>
