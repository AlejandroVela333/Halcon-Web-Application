<div class="workspace">
  <app-sidebar />

  <div class="workspace__content">
    <app-header />

    <main>
      <section class="academic-context" aria-label="Contexto académico demostrativo">
        <div class="academic-context__identity">
          <app-ui-icon name="school" [size]="19" />
          <strong>Colegio Manantial</strong>
          <span aria-hidden="true">•</span>
          <span>Administración de profesores</span>
        </div>
        <div class="active-period">
          <span aria-hidden="true"></span>
          <strong>Período Activo: Demo 2026–2027</strong>
        </div>
      </section>

      <section class="module-heading" aria-labelledby="page-title">
        <div>
          <span class="module-heading__eyebrow">Cuerpo Docente Institucional</span>
          <h1 id="page-title">Profesores</h1>
          <p>Consulta, asignación académica y administración integral del personal docente.</p>
        </div>
        <button class="register-button" type="button">
          <app-ui-icon name="user-plus" [size]="20" />
          <span>+ Registrar profesor</span>
        </button>
      </section>

      <app-profesores-summary />
      <app-profesores-filters />
      <app-profesores-table />
    </main>
  </div>
</div>
