<section class="filters" aria-labelledby="filters-title">
  <h2 id="filters-title" class="visually-hidden">Buscar y filtrar profesores</h2>

  <div class="filters__grid">
    <label class="field field--search">
      <span>Buscar profesor</span>
      <span class="field__control">
        <app-ui-icon name="search" [size]="19" />
        <input type="search" placeholder="Nombre o cédula de demostración" autocomplete="off" />
      </span>
    </label>

    <label class="field">
      <span>Grado</span>
      <select>
        <option value="">Todos los grados</option>
        <option value="1">1.º</option>
        <option value="2">2.º</option>
      </select>
    </label>

    <label class="field">
      <span>Grupo</span>
      <select>
        <option value="">Todos los grupos</option>
        <option value="a">Grupo A</option>
        <option value="b">Grupo B</option>
      </select>
    </label>

    <label class="field">
      <span>Materia</span>
      <select>
        <option value="">Todas las materias</option>
        <option value="matematicas">Matemáticas</option>
        <option value="lengua">Lengua</option>
      </select>
    </label>

    <button class="clear-button" type="button">Limpiar</button>
  </div>
</section>
